<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Seguimiento | Ciber Acajutla</title><style>body{background:#eff5ff;color:#132744;font:16px system-ui;padding:25px 12px}main{max-width:480px;margin:40px auto;background:white;padding:28px;border-radius:16px;box-shadow:0 10px 35px #142b501a}h1{color:#1955a7}strong{color:#1955a7}.tag{display:inline-block;padding:10px 16px;background:#e4efff;border-radius:22px}dt{color:#697b90;margin-top:16px}dd{margin:4px 0;font-weight:bold}small{color:#64748b}</style></head><body><main><h1>CIBER ACAJUTLA</h1><h2>Seguimiento de reparación</h2><p id="message">Consultando estado…</p><section id="details" hidden><p class="tag" id="status"></p><dl><dt>Orden</dt><dd id="order"></dd><dt>Tipo de equipo</dt><dd id="device"></dd><dt>Recepción</dt><dd id="date"></dd></dl></section><small>Este enlace es privado: no lo compartas con terceros.</small></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="./firebase-config.js"></script><script>(async()=>{const msg=document.getElementById('message');const t=new URLSearchParams(location.search).get('t')||'';if(!/^[a-f0-9]{64}$/.test(t)){msg.textContent='Enlace inválido.';return}try{const cfg=window.CIBER_FIREBASE_CONFIG;if(!cfg)throw Error('Falta configuración Firebase');firebase.initializeApp(cfg);const d=await firebase.firestore().collection('publicTracking').doc(t).get();if(!d.exists)throw Error('Enlace no encontrado');const x=d.data();document.getElementById('status').textContent=x.status||'Pendiente';document.getElementById('order').textContent='#'+x.orderId;document.getElementById('device').textContent=x.deviceType||'Equipo';document.getElementById('date').textContent=x.receivedDate||'—';document.getElementById('details').hidden=false;msg.hidden=true}catch(e){msg.textContent='No se pudo consultar el estado. '+e.message}})()</script></body></html>
